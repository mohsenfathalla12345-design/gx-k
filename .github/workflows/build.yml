name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Create Windows Files
        run: flutter create --platforms=windows .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build EXE
        run: flutter build windows --release --extra-front-end-options=--enable-experiment=dot-shorthands
